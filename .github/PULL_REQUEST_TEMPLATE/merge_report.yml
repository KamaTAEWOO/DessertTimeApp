# 🔀 Merge Request

## 📜 변경 내용
변경한 내용에 대해 간단히 설명해주세요. 
- 예: 새로운 기능을 추가함, 버그 수정, 리팩토링 등

## 🧪 테스트
이 변경 사항을 테스트한 방법을 작성해주세요. 
- 예: 유닛 테스트 실행, 통합 테스트, 수동 테스트 등
- 테스트가 성공한지 여부도 알려주세요.

## 🔧 리팩토링 / 최적화
리팩토링 또는 성능 개선이 포함된 경우, 개선된 부분을 설명해주세요.
- 예: 코드 가독성 향상, 성능 최적화, 중복 코드 제거 등

## 🎯 작업 완료 여부
- [ ] 작업 완료
- [ ] 코드 리뷰 요청
- [ ] 테스트 완료
- [ ] 문서 업데이트 완료 (필요한 경우)

## 🧩 관련된 이슈(들)
이 MR이 해결하는 문제와 관련된 이슈 번호를 추가해주세요.
- 예: Closes #123, Fixes #456

## 📋 스크린샷 또는 데모
UI 변경 사항이 있는 경우, 스크린샷 또는 데모를 추가해주세요.
- 예: 변경된 UI의 화면 캡처

## 📅 작업 완료 날짜
작업을 완료한 날짜를 기록해 주세요.

## 🔄 리버트 계획
만약 문제가 발생하면, 변경 사항을 리버트(되돌리기)하는 방법을 설명해주세요.
- 예: `git revert <commit-hash>`
